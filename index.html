<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coração Neon - Saskia</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      height: 100vh;
      background: radial-gradient(circle at center, #160024 0%, #050008 45%, #000 100%);
      font-family: 'Segoe UI', cursive, sans-serif;
      color: white;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    .content {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      pointer-events: none;
    }

    .name {
      font-size: clamp(4rem, 13vw, 11rem);
      font-weight: 900;
      color: #c000ff;
      text-shadow:
        0 0 8px #d633ff,
        0 0 18px #c000ff,
        0 0 35px #9d00ff,
        0 0 70px #ff00ea;
      animation: glowName 2.5s ease-in-out infinite alternate;
      letter-spacing: 4px;
    }

    .phrase {
      margin-top: 20px;
      font-size: clamp(1.1rem, 3vw, 2rem);
      color: #ffd6ff;
      text-shadow: 0 0 10px #ff00ea, 0 0 25px #9d00ff;
      animation: floatText 4s ease-in-out infinite;
      max-width: 90%;
    }

    .hint {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      font-size: 14px;
      color: #f6b6ff;
      opacity: 0.8;
      text-shadow: 0 0 10px #ff00ff;
      pointer-events: none;
    }

    .play-button {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 5;
      border: 1px solid #e100ff;
      background: rgba(70, 0, 100, 0.35);
      color: #fff;
      padding: 12px 18px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 15px #c000ff, inset 0 0 12px #7b00ff;
      backdrop-filter: blur(8px);
    }

    .play-button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px #ff00ff, inset 0 0 18px #9d00ff;
    }

    @keyframes glowName {
      from {
        transform: scale(1);
        filter: brightness(1);
      }
      to {
        transform: scale(1.06);
        filter: brightness(1.35);
      }
    }

    @keyframes floatText {
      0%, 100% { transform: translateY(0); opacity: 0.85; }
      50% { transform: translateY(-12px); opacity: 1; }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <button class="play-button" onclick="toggleMusic()">♪ Música</button>

  <div class="content">
    <h1 class="name">Saskia</h1>
    <p class="phrase">Eu te amo</p>
  </div>

  <div class="hint">Mova o mouse ou toque na tela ✨</div>

 <audio id="music" loop>
  <source src="musica.mp3" type="audio/mpeg">
</audio>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const music = document.getElementById('music');

    let width, height;
    let particles = [];
    let stars = [];
    let mouse = { x: 0, y: 0 };
    let time = 0;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resize);
    resize();

    function heartPoint(t, scale) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return {
        x: width / 2 + x * scale,
        y: height / 2 + y * scale
      };
    }

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 1.8;
        this.vy = (Math.random() - 0.5) * 1.8;
        this.life = Math.random() * 80 + 50;
        this.maxLife = this.life;
        this.size = Math.random() * 3 + 1;
        this.color = color;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
      }

      draw() {
        const alpha = this.life / this.maxLife;
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.shadowBlur = 18;
        ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    class Star {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.size = Math.random() * 2;
        this.speed = Math.random() * 0.4 + 0.1;
        this.alpha = Math.random();
      }

      update() {
        this.y += this.speed;
        if (this.y > height) {
          this.y = 0;
          this.x = Math.random() * width;
        }
        this.alpha += Math.random() * 0.08 - 0.04;
        this.alpha = Math.max(0.2, Math.min(1, this.alpha));
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ffffff';
        ctx.fillStyle = Math.random() > 0.5 ? '#ffffff' : '#e100ff';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 180; i++) stars.push(new Star());

    function drawHeart() {
      const pulse = 1 + Math.sin(time * 0.05) * 0.08;
      const scale = Math.min(width, height) / 36 * pulse;

      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      for (let layer = 0; layer < 4; layer++) {
        ctx.beginPath();
        const layerScale = scale + layer * 2;

        for (let i = 0; i <= Math.PI * 2; i += 0.015) {
          const p = heartPoint(i, layerScale);
          if (i === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        }

        ctx.closePath();
        ctx.strokeStyle = layer % 2 === 0 ? '#ff00ea' : '#8f00ff';
        ctx.lineWidth = layer === 0 ? 3 : 1.5;
        ctx.shadowBlur = 25 + layer * 10;
        ctx.shadowColor = layer % 2 === 0 ? '#ff00ea' : '#8f00ff';
        ctx.stroke();
      }

      ctx.restore();

      if (time % 2 === 0) {
        for (let i = 0; i < 7; i++) {
          const t = Math.random() * Math.PI * 2;
          const p = heartPoint(t, scale);
          particles.push(new Particle(p.x, p.y, Math.random() > 0.5 ? '#ff00ea' : '#a100ff'));
        }
      }
    }

    function drawAnimeGlow() {
      const gradient = ctx.createRadialGradient(width / 2, height / 2, 20, width / 2, height / 2, width / 1.5);
      gradient.addColorStop(0, 'rgba(255, 0, 234, 0.16)');
      gradient.addColorStop(0.4, 'rgba(120, 0, 255, 0.09)');
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);
    }

    function drawMouseParticles() {
      if (Math.random() > 0.45) {
        particles.push(new Particle(mouse.x, mouse.y, '#d600ff'));
      }
    }

    function animate() {
      time++;
      ctx.clearRect(0, 0, width, height);

      drawAnimeGlow();

      stars.forEach(star => {
        star.update();
        star.draw();
      });

      drawHeart();
      drawMouseParticles();

      particles = particles.filter(p => p.life > 0);
      particles.forEach(p => {
        p.update();
        p.draw();
      });

      requestAnimationFrame(animate);
    }

    animate();

    window.addEventListener('mousemove', e => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    window.addEventListener('touchmove', e => {
      const touch = e.touches[0];
      mouse.x = touch.clientX;
      mouse.y = touch.clientY;
    });

    function toggleMusic() {
      if (!music.querySelector('source')) {
        alert('Coloque um arquivo de música chamado musica.mp3 na mesma pasta e adicione: <source src="musica.mp3" type="audio/mpeg"> dentro do audio.');
        return;
      }

      if (music.paused) {
        music.play();
      } else {
        music.pause();
      }
    }
  </script>
</body>
</html>
